<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <rect width="1500" height="680" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <style>
      .title{font:700 28px Arial,"Noto Sans CJK SC",sans-serif;fill:#182230}
      .label{font:700 19px Arial,"Noto Sans CJK SC",sans-serif;fill:#182230}
      .text{font:16px Arial,"Noto Sans CJK SC",sans-serif;fill:#344054}
      .small{font:14px Arial,"Noto Sans CJK SC",sans-serif;fill:#475467}
      .box{stroke:#98A2B3;stroke-width:1.5;rx:10;ry:10}
      .line{stroke:#344054;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text class="title" x="60" y="58">杭州三日游团建：从业务输入到可回收结果</text>

  <rect class="box" x="60" y="172" width="260" height="120" fill="#EEF4FF"/>
  <text class="label" x="92" y="214">ProjectBrief</text>
  <text class="text" x="92" y="250">原始团建需求</text>

  <rect class="box" x="410" y="140" width="330" height="184" fill="#F0FDF4"/>
  <text class="label" x="444" y="184">主 Agent 规划</text>
  <text class="text" x="444" y="220">动态生成 TaskCard</text>
  <text class="text" x="444" y="252">决定执行者和依赖</text>
  <text class="small" x="444" y="286">代码只校验结构和边界</text>

  <rect class="box" x="830" y="166" width="230" height="132" fill="#FFF7ED"/>
  <text class="label" x="864" y="208">公共任务板</text>
  <text class="text" x="864" y="244">status / deps / result</text>
  <text class="small" x="864" y="272">主 Agent 全局视图</text>

  <rect class="box" x="1160" y="76" width="280" height="118" fill="#F9F5FF"/>
  <text class="label" x="1192" y="116">Card A</text>
  <text class="text" x="1192" y="152">事实、缺口、核验项</text>

  <rect class="box" x="1160" y="250" width="280" height="118" fill="#FDF2FA"/>
  <text class="label" x="1192" y="290">Card B</text>
  <text class="text" x="1192" y="326">行程和团建方案草案</text>

  <rect class="box" x="1160" y="424" width="280" height="118" fill="#FFF7ED"/>
  <text class="label" x="1192" y="464">Card C</text>
  <text class="text" x="1192" y="500">预算、节奏、风险复核</text>

  <path class="line" d="M320 232 L410 232"/>
  <path class="line" d="M740 232 L830 232"/>
  <path class="line" d="M1060 214 C1102 160 1118 135 1160 135"/>
  <path class="line" d="M1300 194 L1300 250"/>
  <path class="line" d="M1300 368 L1300 424"/>

  <rect class="box" x="410" y="430" width="650" height="106" fill="#F2F4F7"/>
  <text class="label" x="444" y="470">结果回收</text>
  <text class="text" x="444" y="504">每个子任务只拿私有任务包，结果回到公共任务板。</text>

  <path class="line" d="M1160 488 C1044 560 778 560 735 536"/>

  <text class="small" x="80" y="624">任务数量和依赖由主 Agent 决定；护栏校验白名单、DAG 和执行边界。</text>
</svg>
