<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="460" viewBox="0 0 1300 460">
  <rect width="1300" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <style>
      .title{font:700 26px Arial,"Noto Sans CJK SC",sans-serif;fill:#182230}
      .label{font:700 18px Arial,"Noto Sans CJK SC",sans-serif;fill:#182230}
      .text{font:15px Arial,"Noto Sans CJK SC",sans-serif;fill:#344054}
      .small{font:13px Arial,"Noto Sans CJK SC",sans-serif;fill:#475467}
      .box{stroke:#98A2B3;stroke-width:1.4;rx:10;ry:10}
      .line{stroke:#344054;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text class="title" x="48" y="52">三类数据契约划清协作边界</text>

  <rect class="box" x="70" y="108" width="305" height="178" fill="#FFF7ED"/>
  <text class="label" x="105" y="150">TaskCard</text>
  <text class="text" x="105" y="186">公共任务板上的状态卡</text>
  <text class="small" x="105" y="220">status / depends_on / result</text>
  <text class="small" x="105" y="248">主 Agent 和 TriggerFlow 读写</text>

  <rect class="box" x="498" y="82" width="305" height="230" fill="#EEF4FF"/>
  <text class="label" x="532" y="124">WorkerTaskInput</text>
  <text class="text" x="532" y="160">派发给子 Agent 的私有包</text>
  <text class="small" x="532" y="194">goal / context</text>
  <text class="small" x="532" y="222">upstream_results</text>
  <text class="small" x="532" y="250">acceptance / forbidden</text>
  <text class="small" x="532" y="278">不携带完整主会话</text>

  <rect class="box" x="926" y="108" width="305" height="178" fill="#F0FDF4"/>
  <text class="label" x="960" y="150">WorkerResult</text>
  <text class="text" x="960" y="186">回收到任务板的公开结果</text>
  <text class="small" x="960" y="220">text / session_id</text>
  <text class="small" x="960" y="248">update_kinds / permission_decisions</text>

  <path class="line" d="M375 198 C420 198 452 198 498 198"/>
  <path class="line" d="M803 198 C850 198 879 198 926 198"/>
  <path class="line" d="M1080 286 C1028 372 348 372 250 286"/>

  <text class="small" x="402" y="176">裁剪当前卡片</text>
  <text class="small" x="836" y="176">ACP 调用后返回</text>
  <text class="small" x="540" y="398">公开结果写回 TaskCard.result，私有执行过程不回填进公共任务板</text>
</svg>
